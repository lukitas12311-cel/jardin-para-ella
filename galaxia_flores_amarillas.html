<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080600">
<title>Para ti 🌻</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at 50% 45%, #6e5a16 0%, #25200a 18%, #080803 48%, #020202 100%);
    color: white;
    position: relative;
}

/* Estrellitas */
#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff7b0;
    box-shadow: 0 0 8px #ffe96b;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .15; transform: scale(.6); }
    to   { opacity: 1; transform: scale(1.4); }
}

/* Galaxia central */
.galaxy {
    position: absolute;
    width: 190px;
    height: 190px;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 45%,
            #fff3a1 0%,
            #ffd83d 9%,
            #9b7410 30%,
            #5c4308 48%,
            transparent 70%);
    box-shadow:
        0 0 25px #ffd83d,
        0 0 65px #d7a900,
        0 0 120px rgba(255, 215, 50, .45);
    animation: pulse 4s ease-in-out infinite;
    z-index: 2;
}

.galaxy::before,
.galaxy::after {
    content: "";
    position: absolute;
    inset: 18px -55px;
    border: 2px solid rgba(255, 226, 86, .45);
    border-radius: 50%;
    transform: rotate(18deg);
}

.galaxy::after {
    inset: 35px -72px;
    transform: rotate(-24deg);
    opacity: .55;
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(.96); }
    50% { transform: translate(-50%, -50%) scale(1.04); }
}

/* Flores */
.flower {
    position: absolute;
    z-index: 4;
    font-size: clamp(28px, 7vw, 65px);
    filter: drop-shadow(0 0 8px rgba(255, 220, 50, .8));
    user-select: none;
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-4deg);
    }
    50% {
        transform: translateY(-18px) rotate(5deg);
    }
}

/* Botón superior */
.title {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: linear-gradient(#fff04e, #c9a900);
    color: #332900;
    border: 2px solid #fff58b;
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: bold;
    font-size: clamp(15px, 4vw, 22px);
    box-shadow: 0 0 20px rgba(255, 221, 50, .8);
    text-align: center;
    white-space: nowrap;
}

/* Mensajes flotantes */
.message {
    position: absolute;
    z-index: 3;
    color: #fffde0;
    font-size: clamp(14px, 3.5vw, 25px);
    font-weight: bold;
    text-shadow: 0 0 8px #000, 0 0 12px #fff2a0;
    opacity: .9;
    animation: messageFloat 7s ease-in-out infinite;
    white-space: nowrap;
}

@keyframes messageFloat {
    0%, 100% { transform: translateY(0); opacity: .55; }
    50% { transform: translateY(-10px); opacity: 1; }
}

/* Texto central */
.centerText {
    position: fixed;
    z-index: 6;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: center;
    pointer-events: none;
}

.centerText h2 {
    font-size: clamp(22px, 6vw, 40px);
    color: #fff8b0;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffd92f,
        0 0 35px #d49e00;
    margin-bottom: 8px;
}

.centerText p {
    font-size: clamp(15px, 4vw, 23px);
    color: white;
    text-shadow: 0 0 8px #000;
}

/* Botón */
button {
    position: fixed;
    z-index: 20;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 24px;
    border: 2px solid #ffe967;
    border-radius: 30px;
    background: rgba(60, 45, 0, .8);
    color: #fff5a0;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(255, 215, 50, .45);
    cursor: pointer;
}

button:active {
    transform: translateX(-50%) scale(.94);
}

/* Lluvia de pétalos al tocar */
.petalo {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-size: 24px;
    animation: petal 1.8s ease-out forwards;
}

@keyframes petal {
    0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(500deg) scale(.4);
    }
}

/* Ajuste para pantallas pequeñas */
@media (max-width: 500px) {
    .galaxy {
        width: 145px;
        height: 145px;
    }

    .message {
        font-size: 13px;
    }

    .flower {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="title">🌻 Feliz Día mamita 🌻</div>

<div class="galaxy"></div>

<div class="centerText">
    <h2>Para mi niña 💛</h2>
    <p>Te amo muchísimo ✨</p>
</div>

<!-- Flores -->
<div class="flower" style="left:4%; top:38%; animation-delay:.2s;">🌻</div>
<div class="flower" style="left:14%; top:54%; animation-delay:1s;">🌻</div>
<div class="flower" style="left:27%; top:68%; animation-delay:.5s;">🌻</div>
<div class="flower" style="left:42%; top:76%; animation-delay:1.5s;">🌻</div>
<div class="flower" style="left:60%; top:72%; animation-delay:.8s;">🌻</div>
<div class="flower" style="left:75%; top:59%; animation-delay:1.2s;">🌻</div>
<div class="flower" style="left:87%; top:43%; animation-delay:.3s;">🌻</div>
<div class="flower" style="left:67%; top:31%; animation-delay:1.8s;">🌻</div>
<div class="flower" style="left:29%; top:29%; animation-delay:1.1s;">🌻</div>

<!-- Mensajes -->
<div class="message" style="left:5%; top:48%; animation-delay:1s;">
    solo soy para ti💛
</div>

<div class="message" style="right:3%; top:52%; animation-delay:2s;">
    mi bebita hermosha✨
</div>

<div class="message" style="left:12%; top:80%; animation-delay:3s;">
    L + J ♡
</div>

<div class="message" style="right:10%; top:76%; animation-delay:1.5s;">
    Te amo mucho muchisimo 🌻
</div>

<button onclick="lluviaDeFlores()">Toca aquí 🌻</button>

<script>
// Crear estrellas aleatorias
const stars = document.getElementById("stars");

for (let i = 0; i < 100; i++) {
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";

    const size = Math.random() * 3 + 1;
    star.style.width = size + "px";
    star.style.height = size + "px";

    stars.appendChild(star);
}

// Lluvia de flores al tocar el botón
function lluviaDeFlores() {
    for (let i = 0; i < 30; i++) {
        const petalo = document.createElement("div");
        petalo.className = "petalo";
        petalo.textContent = Math.random() > 0.35 ? "🌻" : "✨";

        petalo.style.left = "50%";
        petalo.style.top = "55%";

        petalo.style.setProperty("--x",
            (Math.random() * 500 - 250) + "px");

        petalo.style.setProperty("--y",
            (Math.random() * 500 - 250) + "px");

        petalo.style.animationDelay =
            (Math.random() * .5) + "s";

        document.body.appendChild(petalo);

        setTimeout(() => petalo.remove(), 2500);
    }
}

// También permite tocar cualquier parte de la pantalla
document.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") return;

    const petalo = document.createElement("div");
    petalo.className = "petalo";
    petalo.textContent = "🌻";
    petalo.style.left = e.clientX + "px";
    petalo.style.top = e.clientY + "px";
    petalo.style.setProperty("--x",
        (Math.random() * 180 - 90) + "px");
    petalo.style.setProperty("--y",
        (Math.random() * 180 - 90) + "px");

    document.body.appendChild(petalo);
    setTimeout(() => petalo.remove(), 2000);
});
</script>

</body>
</html>
